name: Test and lint workflows
on:
  push:
    branches: ['**']
  # This workflow contains required checks and needs to run for EVERY pull_request
  pull_request:
    branches: ['**']

permissions: {}

concurrency:
  group: test-workflows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256SUM: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ACTIONLINT_REPO: rhysd/actionlint
  GH_TELEMETRY: "false"

jobs:
  check:
    # Required check; do not change name
    name: Check workflows
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'  # Keep this in sync with release.yml's prepare job

      - name: Install Python dependencies
        run: |
          python -m pip install -U --require-hashes -r "bundle/requirements/pip.txt"
          python -m pip install -U --require-hashes -r "bundle/requirements/pyflakes.txt"
          python -m pip install -U --require-hashes -r "bundle/requirements/test.txt"

      - name: Install requirements
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_TARBALL: ${{ format('actionlint_{0}_linux_amd64.tar.gz', env.ACTIONLINT_VERSION) }}
        shell: bash
        run: |
          sudo apt -y install shellcheck
          gh release download \
            --repo "${ACTIONLINT_REPO}" \
            --pattern "${ACTIONLINT_TARBALL}" \
            "v${ACTIONLINT_VERSION}"
          gh attestation verify \
            --repo "${ACTIONLINT_REPO}" \
            "${ACTIONLINT_TARBALL}"
          printf '%s  %s' "${ACTIONLINT_SHA256SUM}" "${ACTIONLINT_TARBALL}" | sha256sum -c -
          tar xvzf "${ACTIONLINT_TARBALL}" actionlint
          sudo install -D --mode=755 actionlint /usr/bin/

      - name: Run actionlint
        run: |
          actionlint -color

      - name: Check Docker shell scripts
        run: |
          shellcheck bundle/docker/linux/*.sh

      - name: Test GHA devscripts
        run: |
          pytest -Werror --tb=short --color=yes devscripts/setup_variables_tests.py

  zizmor:
    # Required check; do not change name
    name: Run zizmor
    permissions:
      contents: read
      actions: read  # Used for online audits of private repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Retain pedantic analysis and its blocking exit code using the pinned CLI,
      # without invoking an action prohibited by repository policy.
      - name: Install verified zizmor CLI
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_VERSION: v1.33.1
          ZIZMOR_SHA256: 3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43
        shell: bash
        run: |
          set -euo pipefail
          archive=zizmor-x86_64-unknown-linux-gnu.tar.gz
          directory=$(mktemp -d)
          cd "$directory"
          gh release download "$ZIZMOR_VERSION" --repo zizmorcore/zizmor --pattern "$archive"
          printf '%s  %s\n' "$ZIZMOR_SHA256" "$archive" | sha256sum -c -
          member=$(tar -tzf "$archive" | grep -E '(^|/)zizmor$')
          tar -xOzf "$archive" "$member" > zizmor
          chmod 755 zizmor
          printf '%s\n' "$directory" >> "$GITHUB_PATH"

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona pedantic .
